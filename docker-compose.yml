services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deskflow}
      POSTGRES_DB: ${POSTGRES_DB:-deskflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deskflow}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-deskflow}:${POSTGRES_PASSWORD:-deskflow}@postgres:5432/${POSTGRES_DB:-deskflow}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  pgdata:
