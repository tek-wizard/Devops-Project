apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deskflow.frontendName" . }}
  labels:
    {{- include "deskflow.labels" . | nindent 4 }}
    app: {{ include "deskflow.frontendName" . }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: {{ include "deskflow.frontendName" . }}
  template:
    metadata:
      labels:
        app: {{ include "deskflow.frontendName" . }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          env:
            - name: BACKEND_URL
              value: "http://{{ include "deskflow.backendName" . }}:{{ .Values.backend.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "deskflow.frontendName" . }}
  labels:
    {{- include "deskflow.labels" . | nindent 4 }}
    app: {{ include "deskflow.frontendName" . }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "deskflow.frontendName" . }}
  ports:
    - name: http
      port: 80
      targetPort: http
