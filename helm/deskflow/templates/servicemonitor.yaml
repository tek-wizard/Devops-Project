{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "deskflow.backendName" . }}
  labels:
    {{- include "deskflow.labels" . | nindent 4 }}
    release: monitoring
spec:
  selector:
    matchLabels:
      app: {{ include "deskflow.backendName" . }}
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
