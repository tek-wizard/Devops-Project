namespace: deskflow

backend:
  image:
    repository: deskflow-backend
    tag: local
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

frontend:
  image:
    repository: deskflow-frontend
    tag: local
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

postgres:
  image: postgres:16-alpine
  storage: 1Gi
  # demo credentials only; use a real secret manager in production
  user: deskflow
  password: deskflow
  db: deskflow

ingress:
  enabled: true
  className: nginx
  host: deskflow.local

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

serviceMonitor:
  enabled: true
  interval: 15s
